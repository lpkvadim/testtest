<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Замер выбора видео</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --ground: #f6f7f9;
        --card: #fff;
        --ink: #16212e;
        --soft: #5b6b7c;
        --line: #dde3ea;
        --accent: #0b6b7a;
        --accent-soft: #e2f1f3;
        --good: #1c6b45;
        --warn: #8a4b12;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #11161c;
          --card: #19212a;
          --ink: #e7edf3;
          --soft: #9aabbb;
          --line: #2b3643;
          --accent: #4ec4d4;
          --accent-soft: #15323a;
          --good: #6cd39b;
          --warn: #e0a86a;
        }
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding-inline: 16px;
        padding-block: 20px calc(32px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 40rem;
        margin-inline: auto;
      }
      .test {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .test h2 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
      }
      .what {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        color: var(--soft);
        word-break: break-all;
      }
      button {
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 10px 18px;
        align-self: flex-start;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      input[type="file"] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .state,
      .row {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        color: var(--soft);
        word-break: break-all;
      }
      .row b {
        color: var(--ink);
        font-weight: 500;
      }
      .result {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .big {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.2rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .orig {
        color: var(--good);
      }
      .conv {
        color: var(--warn);
      }
      textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.72rem;
        width: 100%;
        min-height: 9rem;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .state::before {
          content: "● ";
          animation: pulse 1s ease-in-out infinite;
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <div id="tests"></div>
    <textarea id="out" readonly aria-label="Результаты">Пока ничего не замерено.</textarea>
    <button id="copy" type="button">Скопировать</button>

    <script>
      // Four ways of asking the phone for a file. The first is what the
      // expert's cabinet asks today; the others are the suspects.
      const TESTS = [
        { id: "now", name: "Как сейчас", accept: "video/*,audio/*", multiple: true },
        { id: "one", name: "То же, по одному файлу", accept: "video/*,audio/*", multiple: false },
        { id: "any", name: "Без accept", multiple: true },
        {
          id: "exact",
          name: "Форматы названы",
          accept: "video/mp4,video/quicktime,.mp4,.mov,.m4v",
          multiple: true,
        },
        // What the expert's cabinet asks since 12.10: every type the server
        // takes, spelled out, and no «video/*».
        {
          id: "full",
          name: "Как в правке кабинета",
          accept:
            "video/mp4,video/quicktime,video/x-m4v,video/webm,video/x-matroska,video/x-msvideo,video/3gpp,video/mp2t,.mp4,.mov,.m4v,.webm,.mkv,.avi,.3gp,.mts,.m2ts",
          multiple: true,
        },
      ];

      const CHUNK = 8 * 1024 * 1024;
      const runs = [];
      const out = document.getElementById("out");
      const sec = (ms) => (ms / 1000).toFixed(1).replace(".", ",");
      const mb = (bytes) => Math.round(bytes / 1048576);
      const speed = (bytes, ms) => (ms > 0 ? Math.round(bytes / 1048576 / (ms / 1000)) : 0);
      const describe = (t) =>
        (t.accept ? 'accept="' + t.accept + '"' : "accept не задан") +
        " · " +
        (t.multiple ? "multiple" : "один файл");

      // The name and type the phone hands over tell whether it gave the
      // original asset or an export of it: an iPhone clip is .mov, and a file
      // arriving as .mp4 has been through a conversion.
      function origin(file) {
        const name = (file.name || "").toLowerCase();
        if (name.endsWith(".mov") || file.type === "video/quicktime")
          return { kind: "orig", words: "оригинал .mov" };
        if (name.endsWith(".mp4") || file.type === "video/mp4")
          return { kind: "conv", words: "пересобран в .mp4" };
        return null;
      }

      async function readWhole(file) {
        let read = 0;
        while (read < file.size) {
          const piece = file.slice(read, Math.min(read + CHUNK, file.size));
          // The bytes go straight out again: only their cost is the point.
          const got = await piece.arrayBuffer();
          const step = got.byteLength || piece.size;
          read += step;
          if (!step) break;
        }
        return read;
      }

      function retell() {
        if (!runs.length) return (out.value = "Пока ничего не замерено.");
        const lines = [];
        for (const run of runs) {
          lines.push("— " + run.name + ": " + run.what);
          lines.push("  плёнка думала " + sec(run.picker) + " с, файлов " + run.files.length);
          for (const f of run.files)
            lines.push(
              "  · " +
                f.name +
                " | " +
                (f.type || "тип не назван") +
                " | " +
                mb(f.size) +
                " МБ | чтение " +
                sec(f.read) +
                " с (" +
                speed(f.size, f.read) +
                " МБ/с)",
            );
          lines.push("");
        }
        out.value = lines.join("\n");
      }

      for (const test of TESTS) {
        const card = document.createElement("div");
        card.className = "test";

        const title = document.createElement("h2");
        title.textContent = test.name;
        const what = document.createElement("div");
        what.className = "what";
        what.textContent = describe(test);

        const input = document.createElement("input");
        input.type = "file";
        input.id = "pick-" + test.id;
        input.tabIndex = -1;
        input.setAttribute("aria-hidden", "true");
        if (test.accept) input.accept = test.accept;
        if (test.multiple) input.multiple = true;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Выбрать видео";

        const state = document.createElement("div");
        state.className = "state";
        state.hidden = true;

        const result = document.createElement("div");
        result.className = "result";
        result.hidden = true;

        card.append(title, what, input, button, state, result);
        document.getElementById("tests").append(card);

        let clickedAt = 0;
        const say = (words) => {
          state.hidden = false;
          state.textContent = words;
        };

        button.addEventListener("click", () => {
          clickedAt = performance.now();
          result.hidden = true;
          say("плёнка открыта…");
          input.click();
        });

        input.addEventListener("change", async () => {
          const picker = performance.now() - clickedAt;
          const files = Array.from(input.files || []);
          input.value = "";
          if (!files.length) return (state.hidden = true);

          button.disabled = true;
          result.hidden = false;
          result.textContent = "";
          const big = document.createElement("div");
          big.className = "big";
          big.textContent = sec(picker) + " с · " + files.length + " файл(ов)";
          result.append(big);

          const run = { name: test.name, what: describe(test), picker, files: [] };
          for (const file of files) {
            say("читаю " + file.name + "…");
            const started = performance.now();
            await readWhole(file);
            const took = performance.now() - started;
            const row = document.createElement("div");
            row.className = "row";
            const where = origin(file);
            row.innerHTML =
              "<b>" +
              file.name +
              "</b><br>" +
              (file.type || "тип не назван") +
              " · " +
              mb(file.size) +
              " МБ · чтение " +
              sec(took) +
              " с · " +
              speed(file.size, took) +
              " МБ/с" +
              (where ? ' · <span class="' + where.kind + '">' + where.words + "</span>" : "");
            result.append(row);
            run.files.push({ name: file.name, type: file.type, size: file.size, read: took });
          }

          runs.push(run);
          retell();
          state.hidden = true;
          button.disabled = false;
          button.textContent = "Замерить ещё раз";
        });
      }

      document.getElementById("copy").addEventListener("click", async () => {
        const button = document.getElementById("copy");
        try {
          await navigator.clipboard.writeText(out.value);
          button.textContent = "Скопировано";
        } catch {
          out.select();
          button.textContent = "Выделено — копируйте";
        }
        setTimeout(() => (button.textContent = "Скопировать"), 2500);
      });
    </script>
  </body>
</html>
